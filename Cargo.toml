[package]
name = "ubench"
version = "1.0.0-alpha.1"
description = "UBench - Industry-standard USB flash drive benchmark with honest direct-IO measurement"
authors = ["dongsheng123132"]
edition = "2021"
license = "MIT"
repository = "https://github.com/dongsheng123132/ubench"
homepage = "https://github.com/dongsheng123132/ubench"
readme = "README.md"

[lib]
name = "ubench_lib"

[[bin]]
name = "ubench"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
log = "0.4"
env_logger = "0.11"
indicatif = "0.17"
comfy-table = "7"
ctrlc = "3"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_Foundation",
  "Win32_System_Ioctl",
  "Win32_Security",
] }
wmi = "0.14"
